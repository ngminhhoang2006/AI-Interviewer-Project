<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interviewee Report Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">Interview Portal</a>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/interview_portal">Take Interview</a></li>
        <li><a href="/results_checker" class="active">Check Results</a></li>
    </ul>
</nav>

<div class="main-container">
    <div class="page-header">
        <h1>🔍 Interviewee Report Checker</h1>
        <p class="subtitle">Search for candidate records and review completed grading evaluations.</p>
    </div>

    <div class="card search-card">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter candidate name (e.g., Nguyen Minh Hoang)..." onkeyup="if(event.key === 'Enter') searchCandidate()">
            <button class="btn btn-teal" onclick="searchCandidate()">Search</button>
        </div>

        <div id="searchResults" class="results-container"></div>
    </div>

    <div id="reportContainer" class="card report-view hidden">
        <div class="report-header">
            <h3 id="reportTitle">Candidate Report</h3>
            <button onclick="closeReport()" class="btn btn-outline-danger">Close Report</button>
        </div>
        <hr class="divider">
        <div id="reportContent"></div>
    </div>
</div>

<script>
    async function searchCandidate() {
        const query = document.getElementById("searchInput").value.trim();
        const resultsDiv = document.getElementById("searchResults");
        const reportDiv = document.getElementById("reportContainer");

        if (!query) {
            alert("Please enter a candidate name.");
            return;
        }

        resultsDiv.innerHTML = "<div class='loading-state'>Searching database...</div>";
        reportDiv.classList.add("hidden");

        try {
            const res = await fetch("/api/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: query })
            });

            const data = await res.json();
            resultsDiv.innerHTML = "";

            if (data.message) {
                resultsDiv.innerHTML = `<p class="empty-msg">${data.message}</p>`;
                return;
            }

            data.candidates.forEach(cand => {
                const card = document.createElement("div");
                card.className = "candidate-item";

                let reportsHTML = "";
                if (cand.reports.length === 0) {
                    reportsHTML = "<p class='empty-msg'>No report file (.md) found for this candidate.</p>";
                } else {
                    cand.reports.forEach(reportName => {
                        reportsHTML += `
                            <div class="report-row">
                                <span class="file-name">📄 ${reportName}</span>
                                <button class="btn btn-teal-sm" onclick="viewReport('${cand.folder_path}', '${reportName}')">View Report</button>
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <h4>Candidate Folder: <strong>${cand.folder_name}</strong></h4>
                    ${reportsHTML}
                `;
                resultsDiv.appendChild(card);
            });
        } catch (err) {
            resultsDiv.innerHTML = "<p class='empty-msg'>Failed to retrieve search results.</p>";
        }
    }

    async function viewReport(folderPath, reportFilename) {
        const res = await fetch("/api/get_report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folder_path: folderPath, report_filename: reportFilename })
        });

        const data = await res.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById("reportTitle").innerText = `Report: ${data.candidate}`;
        document.getElementById("reportContent").innerHTML = data.content_html;
        
        const reportDiv = document.getElementById("reportContainer");
        reportDiv.classList.remove("hidden");
        reportDiv.scrollIntoView({ behavior: 'smooth' });
    }

    function closeReport() {
        document.getElementById("reportContainer").classList.add("hidden");
    }
</script>

</body>
</html>
