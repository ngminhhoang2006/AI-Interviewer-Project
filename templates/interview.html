<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Interview Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge { background: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
        
        /* Mode Switcher Banner */
        .mode-container { display: flex; justify-content: space-between; align-items: center; background: #eef2f5; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; }
        .mode-options label { margin-left: 10px; cursor: pointer; font-weight: bold; }

        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 10px; margin-right: 5px; }
        button:hover { background-color: #27ae60; }
        
        /* Voice Button Styling */
        .btn-speak { background-color: #3498db; }
        .btn-speak:hover { background-color: #2980b9; }
        .btn-mic { background-color: #e67e22; }
        .btn-mic:hover { background-color: #d35400; }
        .btn-mic.recording { background-color: #e74c3c; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
        .loading { color: #888; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="mode-container">
        <strong>Interview Mode:</strong>
        <div class="mode-options">
            <input type="radio" id="modeVoice" name="interviewMode" value="voice" checked onchange="switchMode('voice')">
            <label for="modeVoice">🎤 Voice Mode</label>
            
            <input type="radio" id="modeText" name="interviewMode" value="text" onchange="switchMode('text')">
            <label for="modeText">⌨️ Text Mode</label>
        </div>
    </div>

    <h2>Interview Session: {{ candidate }}</h2>
    <hr>
    
    <div id="questionContainer">
        <p>
            <span id="qBadge" class="badge"></span>
            <span id="diffBadge" class="badge"></span>
        </p>
        <h3 id="questionText">Loading question...</h3>
        <button id="btnReplay" class="btn-speak">🔊 Read Question Aloud</button>
    </div>

    <div style="margin-top: 20px;">
        <label for="answerInput">Your Answer:</label>
        <textarea id="answerInput" placeholder="Type your answer or use voice recording..."></textarea>
        
        <div class="controls">
            <div>
                <button id="btnRecord" class="btn-mic">🎤 Start Recording</button>
                <button id="btnSubmit">Submit Answer</button>
            </div>
            <span id="recordingStatus" class="loading" style="margin: 0;"></span>
        </div>
    </div>

    <div id="status" class="loading"></div>
</div>

<script>
    const questions = {{ questions | tojson }};
    const candidate = "{{ candidate }}";
    const language = "{{ language }}";
    
    let currentQIndex = 0;
    let answers = [];
    let isFollowUp = false;
    let currentQuestionObj = null;

    // --- State & Voice Controls ---
    let activeMode = 'voice'; // Default to Voice Mode
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    const synth = window.speechSynthesis;

    function switchMode(mode) {
        activeMode = mode;
        synth.cancel(); // Stop talking if switching modes

        if (activeMode === 'text') {
            document.getElementById("btnReplay").style.display = "inline-block"; // Keep available manually
            if (isRecording) stopRecording();
        } else {
            document.getElementById("btnReplay").style.display = "inline-block";
            speakQuestion(document.getElementById("questionText").innerText);
        }
    }

    /**
     * Text-to-Speech
     */
    function speakQuestion(text, onEndCallback = null) {
        if (!synth) return;
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = {
            'English': 'en-US',
            'Vietnamese': 'vi-VN',
            'Spanish': 'es-ES',
            'French': 'fr-FR'
        };
        utterance.lang = langMap[language] || 'en-US';
        utterance.rate = 1.0;

        // Auto-start recording after question finishes reading (Voice Mode only)
        utterance.onend = () => {
            if (activeMode === 'voice' && !isRecording && onEndCallback) {
                onEndCallback();
            }
        };

        synth.speak(utterance);
    }

    /**
     * Speech-to-Text Recording Controls
     */
    async function startRecording() {
        const recordBtn = document.getElementById("btnRecord");
        const recordingStatus = document.getElementById("recordingStatus");

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                recordingStatus.innerText = "Transcribing audio...";
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                await sendAudioToWhisper(audioBlob);
                recordingStatus.innerText = "";
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add("recording");
            recordBtn.innerText = "🛑 Stop Recording";
            recordingStatus.innerText = "Listening...";
        } catch (err) {
            console.error("Microphone access error:", err);
            alert("Microphone access is required for voice input.");
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            
            const recordBtn = document.getElementById("btnRecord");
            recordBtn.classList.remove("recording");
            recordBtn.innerText = "🎤 Start Recording";
        }
    }

    function toggleRecording() {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    }

    async function sendAudioToWhisper(audioBlob) {
        const formData = new FormData();
        formData.append("audio", audioBlob, "recording.webm");

        try {
            const response = await fetch("/api/interview/transcribe-audio", {
                method: "POST",
                body: formData
            });
            
            const data = await response.json();
            if (data.transcript) {
                const answerInput = document.getElementById("answerInput");
                answerInput.value = answerInput.value 
                    ? `${answerInput.value.trim()} ${data.transcript}` 
                    : data.transcript;
            }
        } catch (err) {
            console.error("Failed to transcribe audio:", err);
        }
    }

    // --- Core Interview Flow ---

    function renderQuestion() {
        if (currentQIndex >= questions.length || answers.length >= 10) {
            finishInterview();
            return;
        }

        currentQuestionObj = questions[currentQIndex];
        document.getElementById("qBadge").innerText = `Q${answers.length + 1} (${currentQuestionObj.category || 'General'})`;
        document.getElementById("diffBadge").innerText = `Difficulty: ${currentQuestionObj.difficulty || 'N/A'}`;
        document.getElementById("questionText").innerText = currentQuestionObj.question;
        document.getElementById("answerInput").value = "";
        document.getElementById("status").innerText = "";

        // Read question aloud if in Voice Mode
        if (activeMode === 'voice') {
            speakQuestion(currentQuestionObj.question, () => {
                // Auto-start recording after question is read
                startRecording();
            });
        }
    }

    document.getElementById("btnReplay").onclick = () => {
        speakQuestion(document.getElementById("questionText").innerText);
    };

    document.getElementById("btnRecord").onclick = toggleRecording;

    document.getElementById("btnSubmit").onclick = async () => {
        if (isRecording) stopRecording();
        synth.cancel();

        const answer = document.getElementById("answerInput").value.trim();
        if (!answer) {
            alert("Please enter an answer or record your voice response.");
            return;
        }

        document.getElementById("status").innerText = "Processing answer...";

        if (!isFollowUp) {
            const record = {
                question_number: answers.length + 1,
                type: "predefined",
                category: currentQuestionObj.category,
                difficulty: currentQuestionObj.difficulty,
                topic: currentQuestionObj.topic,
                question: currentQuestionObj.question,
                answer: answer
            };
            answers.push(record);

            document.getElementById("status").innerText = "Checking if follow-up is needed...";
            const res = await fetch("/api/follow_up", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    candidate_name: candidate,
                    language: language,
                    current_question: currentQuestionObj.question,
                    answer: answer,
                    previous_answers: answers
                })
            });
            const data = await res.json();

            if (data.follow_up && answers.length < 10) {
                isFollowUp = true;
                document.getElementById("qBadge").innerText = `Q${answers.length + 1} (Follow-Up)`;
                document.getElementById("questionText").innerText = data.follow_up;
                document.getElementById("answerInput").value = "";
                document.getElementById("status").innerText = "";

                if (activeMode === 'voice') {
                    speakQuestion(data.follow_up, () => startRecording());
                }
                return;
            }
        } else {
            const record = {
                question_number: answers.length + 1,
                type: "follow_up",
                category: currentQuestionObj.category,
                difficulty: currentQuestionObj.difficulty,
                topic: currentQuestionObj.topic,
                question: document.getElementById("questionText").innerText,
                answer: answer
            };
            answers.push(record);
            isFollowUp = false;
        }

        currentQIndex++;
        renderQuestion();
    };

    async function finishInterview() {
        synth.cancel();
        if (isRecording) stopRecording();
        
        document.getElementById("status").innerText = "Saving answers and finalizing interview...";
        const res = await fetch("/api/save_answers", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                candidate_folder: candidate,
                language: language,
                answers: answers
            })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = data.redirect;
        }
    }

    // Initialize first question
    renderQuestion();
</script>

</body>
</html>
