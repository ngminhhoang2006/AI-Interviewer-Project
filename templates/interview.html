{% extends "base.html" %}

{% block title %}{{ t('int.title') }}{% endblock %}

{% block content %}
<div class="card interview-card" id="interviewConfig"
     data-candidate="{{ candidate or '' }}" data-language="{{ language or 'English' }}"
     data-lang-tag="{{ language_tag or '' }}">

    <div class="session-bar">
        <p class="session-title">{{ th('int.session', candidate=candidate or t('int.candidate')) }}</p>
        <div class="mode-banner">
            <span class="mode-label">{{ t('int.mode') }}</span>
            <div class="mode-options">
                <label for="modeVoice" class="radio-label">
                    <input type="radio" id="modeVoice" name="interviewMode" value="voice" checked>
                    {{ t('int.voice') }}
                </label>
                <label for="modeText" class="radio-label">
                    <input type="radio" id="modeText" name="interviewMode" value="text">
                    {{ t('int.text') }}
                </label>
            </div>
        </div>
    </div>

    <div id="questionContainer">
        <div class="badge-group">
            <span id="qBadge" class="pill-badge"></span>
            <span id="diffBadge" class="pill-badge"></span>
        </div>
        <h2 id="questionText" class="question-prompt" dir="auto">{{ t('int.loading') }}</h2>
        <button id="btnReplay" class="btn btn-quiet btn-sm">{{ t('int.replay') }}</button>
    </div>

    <div class="answer-section">
        <label for="answerInput" class="input-label">{{ t('int.answer') }}</label>
        <textarea id="answerInput" rows="4" dir="auto" placeholder="{{ t('int.answer_ph') }}"></textarea>

        <div class="controls-bar">
            <span id="recordingStatus" class="loading-state"></span>
            <div class="btn-group">
                <button id="btnRecord" class="btn btn-quiet">{{ t('int.start_rec') }}</button>
                <button id="btnSubmit" class="btn">{{ t('int.submit') }}</button>
            </div>
        </div>
    </div>

    <div id="status" class="loading-state"></div>
</div>

<script type="application/json" id="questionsData">{{ (questions or []) | tojson }}</script>
<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
