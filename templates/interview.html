{% extends "base.html" %}

{% block title %}AI Interview Session{% endblock %}

{% block content %}
<div class="card interview-card" id="interviewConfig"
     data-candidate="{{ candidate or '' }}" data-language="{{ language or 'English' }}">
    
    <!-- Interview Mode Selector Banner -->
    <div class="mode-banner">
        <span class="mode-label">Interview Mode:</span>
        <div class="mode-options">
            <label for="modeVoice" class="radio-label">
                <input type="radio" id="modeVoice" name="interviewMode" value="voice" checked onchange="switchMode('voice')">
                🎤 Voice Mode
            </label>
            <label for="modeText" class="radio-label">
                <input type="radio" id="modeText" name="interviewMode" value="text" onchange="switchMode('text')">
                ⌨️ Text Mode
            </label>
        </div>
    </div>

    <h2 class="session-title">Interview Session: {{ candidate or "Candidate" }}</h2>
    <hr class="divider">
    
    <!-- Question Block -->
    <div id="questionContainer">
        <div class="badge-group">
            <span id="qBadge" class="pill-badge"></span>
            <span id="diffBadge" class="pill-badge"></span>
        </div>
        <h3 id="questionText" class="question-prompt">Loading question...</h3>
        <button id="btnReplay" class="btn btn-blue-sm">🔊 Read Question Aloud</button>
    </div>

    <!-- Answer Block -->
    <div class="answer-section">
        <label for="answerInput" class="input-label">Your Answer:</label>
        <textarea id="answerInput" class="custom-textarea" rows="4" placeholder="Type your answer or use voice recording..."></textarea>
        
        <div class="controls-bar">
            <div class="btn-group">
                <button id="btnRecord" class="btn btn-orange">🎤 Start Recording</button>
                <button id="btnSubmit" class="btn btn-emerald">Submit Answer</button>
            </div>
            <span id="recordingStatus" class="loading-state"></span>
        </div>
    </div>

    <div id="status" class="loading-state"></div>
</div>

<script type="application/json" id="questionsData">{{ (questions or []) | tojson }}</script>
<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
