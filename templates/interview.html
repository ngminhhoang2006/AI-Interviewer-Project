<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Session</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">Interview Portal</a>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/interview_portal" class="active">Take Interview</a></li>
        <li><a href="/results_checker">Check Results</a></li>
    </ul>
</nav>

<div class="main-container">
    <div class="card interview-card">
        
        <!-- Interview Mode Selector Banner -->
        <div class="mode-banner">
            <span class="mode-label">Interview Mode:</span>
            <div class="mode-options">
                <label for="modeVoice" class="radio-label">
                    <input type="radio" id="modeVoice" name="interviewMode" value="voice" checked onchange="switchMode('voice')">
                    🎤 Voice Mode
                </label>
                <label for="modeText" class="radio-label">
                    <input type="radio" id="modeText" name="interviewMode" value="text" onchange="switchMode('text')">
                    ⌨️ Text Mode
                </label>
            </div>
        </div>

        <h2 class="session-title">Interview Session: {{ candidate or "Candidate" }}</h2>
        <hr class="divider">
        
        <!-- Question Block -->
        <div id="questionContainer">
            <div class="badge-group">
                <span id="qBadge" class="pill-badge"></span>
                <span id="diffBadge" class="pill-badge"></span>
            </div>
            <h3 id="questionText" class="question-prompt">Loading question...</h3>
            <button id="btnReplay" class="btn btn-blue-sm">🔊 Read Question Aloud</button>
        </div>

        <!-- Answer Block -->
        <div class="answer-section">
            <label for="answerInput" class="input-label">Your Answer:</label>
            <textarea id="answerInput" class="custom-textarea" rows="4" placeholder="Type your answer or use voice recording..."></textarea>
            
            <div class="controls-bar">
                <div class="btn-group">
                    <button id="btnRecord" class="btn btn-orange">🎤 Start Recording</button>
                    <button id="btnSubmit" class="btn btn-emerald">Submit Answer</button>
                </div>
                <span id="recordingStatus" class="loading-state"></span>
            </div>
        </div>

        <div id="status" class="loading-state"></div>
    </div>
</div>

<script>
    const questions = {{ (questions or []) | tojson }};
    const candidate = "{{ candidate or '' }}";
    const language = "{{ language or 'English' }}";
    
    let currentQIndex = 0;
    let answers = [];
    let isFollowUp = false;
    let currentQuestionObj = null;

    let activeMode = 'voice';
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    
    // Custom audio player instance for Sherpa-ONNX WAVs
    let currentAudioPlayer = null;
    const synth = window.speechSynthesis;

    function stopAllSpeech() {
        if (currentAudioPlayer) {
            currentAudioPlayer.pause();
            currentAudioPlayer = null;
        }
        if (synth) {
            synth.cancel();
        }
    }

    function switchMode(mode) {
        activeMode = mode;
        stopAllSpeech();

        if (activeMode === 'text') {
            document.getElementById("btnReplay").style.display = "inline-block";
            if (isRecording) stopRecording();
        } else {
            document.getElementById("btnReplay").style.display = "inline-block";
            speakQuestion(document.getElementById("questionText").innerText);
        }
    }

    /**
     * Synthesizes audio via Sherpa-ONNX (/api/tts) first; falls back to Web Speech API if unhandled.
     */
    async function speakQuestion(text, onEndCallback = null) {
        if (!text || !text.trim()) return;
        stopAllSpeech();

        console.log("[TTS] Requesting Sherpa-ONNX TTS generation...");

        try {
            const response = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, language: language })
            });

            const data = await response.json();

            if (data.status === "success" && data.audio_data) {
                console.log("[TTS] Sherpa-ONNX base64 audio received. Playing...");
                currentAudioPlayer = new Audio(data.audio_data);

                currentAudioPlayer.onended = () => {
                    if (activeMode === 'voice' && !isRecording && onEndCallback) {
                        onEndCallback();
                    }
                };

                await currentAudioPlayer.play();
                return;
            }

            console.warn("[TTS Fallback] Sherpa-ONNX failed or unavailable, falling back to Web Speech API.");
            triggerBrowserTTS(text, onEndCallback);

        } catch (err) {
            console.error("[TTS Error] Failed to reach /api/tts endpoint:", err);
            triggerBrowserTTS(text, onEndCallback);
        }
    }

    function triggerBrowserTTS(text, onEndCallback = null) {
        if (!synth) return;

        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = {
            'English': 'en-US',
            'Vietnamese': 'vi-VN',
            'Spanish': 'es-ES',
            'French': 'fr-FR'
        };
        utterance.lang = langMap[language] || 'en-US';
        utterance.rate = 1.0;

        utterance.onend = () => {
            if (activeMode === 'voice' && !isRecording && onEndCallback) {
                onEndCallback();
            }
        };

        synth.speak(utterance);
    }

    async function startRecording() {
        const recordBtn = document.getElementById("btnRecord");
        const recordingStatus = document.getElementById("recordingStatus");

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm')) {
                if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
                else mimeType = '';
            }

            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                recordingStatus.innerText = "Transcribing audio...";
                const blobType = mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: blobType });
                await sendAudioToWhisper(audioBlob);
                recordingStatus.innerText = "";
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add("recording");
            recordBtn.innerText = "⏹️ Stop Recording";
            recordingStatus.innerText = "Listening...";
        } catch (err) {
            console.error("Microphone access error:", err);
            alert("Microphone access is required for voice input.");
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            
            const recordBtn = document.getElementById("btnRecord");
            recordBtn.classList.remove("recording");
            recordBtn.innerText = "🎤 Start Recording";
        }
    }

    function toggleRecording() {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    }

    async function sendAudioToWhisper(audioBlob) {
        const formData = new FormData();
        formData.append("audio", audioBlob, "recording.webm");
        // Ensure the template variable 'language' (e.g., 'Vietnamese' or 'English') is sent
        formData.append("language", language); 

        try {
            const response = await fetch("/api/interview/transcribe-audio", {
                method: "POST",
                body: formData
            });
    
            const data = await response.json();
            if (data.transcript) {
                const answerInput = document.getElementById("answerInput");
                answerInput.value = answerInput.value 
                    ? `${answerInput.value.trim()} ${data.transcript}` 
                    : data.transcript;
            }
        } catch (err) {
            console.error("Failed to transcribe audio:", err);
        }
    }

    function renderQuestion() {
        if (!questions || questions.length === 0 || currentQIndex >= questions.length || answers.length >= 10) {
            finishInterview();
            return;
        }

        currentQuestionObj = questions[currentQIndex];
        document.getElementById("qBadge").innerText = `Q${answers.length + 1} (${currentQuestionObj.category || 'introduction'})`;
        document.getElementById("diffBadge").innerText = `Difficulty: ${currentQuestionObj.difficulty || 'general'}`;
        document.getElementById("questionText").innerText = currentQuestionObj.question;
        document.getElementById("answerInput").value = "";
        document.getElementById("status").innerText = "";

        if (activeMode === 'voice') {
            speakQuestion(currentQuestionObj.question, () => {
                startRecording();
            });
        }
    }

    document.getElementById("btnReplay").onclick = () => {
        speakQuestion(document.getElementById("questionText").innerText);
    };

    document.getElementById("btnRecord").onclick = toggleRecording;

    document.getElementById("btnSubmit").onclick = async () => {
        if (isRecording) stopRecording();
        stopAllSpeech();

        const answer = document.getElementById("answerInput").value.trim();
        if (!answer) {
            alert("Please enter an answer or record your voice response.");
            return;
        }
        
        // Ask for confirmation before proceeding
        const isConfirmed = confirm("Are you sure you want to submit this answer?");
        if (!isConfirmed) {
            return;
        }

        document.getElementById("status").innerText = "Processing answer...";

        if (!isFollowUp) {
            const record = {
                question_number: answers.length + 1,
                type: "predefined",
                category: currentQuestionObj.category,
                difficulty: currentQuestionObj.difficulty,
                topic: currentQuestionObj.topic,
                question: currentQuestionObj.question,
                answer: answer
            };
            answers.push(record);

            document.getElementById("status").innerText = "Checking if follow-up is needed...";
            const res = await fetch("/api/follow_up", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    candidate_name: candidate,
                    language: language,
                    current_question: currentQuestionObj.question,
                    answer: answer,
                    previous_answers: answers
                })
            });
            const data = await res.json();

            if (data.follow_up && answers.length < 10) {
                isFollowUp = true;
                document.getElementById("qBadge").innerText = `Q${answers.length + 1} (Follow-Up)`;
                document.getElementById("questionText").innerText = data.follow_up;
                document.getElementById("answerInput").value = "";
                document.getElementById("status").innerText = "";

                if (activeMode === 'voice') {
                    speakQuestion(data.follow_up, () => startRecording());
                }
                return;
            }
        } else {
            const record = {
                question_number: answers.length + 1,
                type: "follow_up",
                category: currentQuestionObj.category,
                difficulty: currentQuestionObj.difficulty,
                topic: currentQuestionObj.topic,
                question: document.getElementById("questionText").innerText,
                answer: answer
            };
            answers.push(record);
            isFollowUp = false;
        }

        currentQIndex++;
        renderQuestion();
    };

    async function finishInterview() {
        stopAllSpeech();
        if (isRecording) stopRecording();
        
        document.getElementById("status").innerText = "Saving answers and finalizing interview...";
        const res = await fetch("/api/save_answers", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                candidate_folder: candidate,
                language: language,
                answers: answers
            })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = data.redirect;
        }
    }

    renderQuestion();
</script>

</body>
</html>
