{% extends "base.html" %}

{% block title %}AI Interview Portal - Setup{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Candidate Interview Setup</h1>
    <p class="subtitle">Upload a candidate resume to generate technical interview questions.</p>
</div>

<div class="card setup-card">
    <!-- Step 1: Upload CV -->
    <div id="step-upload">
        <h3>Step 1: Upload Candidate CV</h3>
        <form id="uploadForm" class="form-container">
            <div class="file-upload-wrapper">
                <label for="cv_file" class="file-dropzone">
                    <span class="file-icon">📁</span>
                    <span id="fileNameDisplay" class="file-text">Click or drag PDF resume here</span>
                    <input type="file" id="cv_file" name="cv_file" accept=".pdf" required onchange="updateFileName(this)">
                </label>
            </div>
            <button type="submit" class="btn btn-teal btn-lg">Parse CV</button>
        </form>
    </div>

    <!-- Step 2: Select Language & Generate -->
    <div id="step-questions" class="hidden">
        <h3>Step 2: Generate Questions</h3>
        <p class="candidate-info">Candidate: <strong id="candidateName"></strong></p>
        
        <div class="form-group">
            <label for="language">Interview Language</label>
            <div class="select-wrapper">
                <select id="language" class="custom-select">
                    {# The list comes from SUPPORTED_LANGUAGES in interview_app.py; the fallback keeps the page working without it #}
                    {% set langs = interview_languages if interview_languages is defined else [
                        {'value': 'English', 'label': 'English'},
                        {'value': 'Vietnamese', 'label': 'Vietnamese (Tiếng Việt)'},
                        {'value': 'Spanish', 'label': 'Spanish (Español)'},
                        {'value': 'French', 'label': 'French (Français)'},
                        {'value': 'German', 'label': 'German (Deutsch)'},
                        {'value': 'Italian', 'label': 'Italian (Italiano)'},
                        {'value': 'Portuguese', 'label': 'Portuguese (Português)'},
                        {'value': 'Russian', 'label': 'Russian (Русский)'},
                        {'value': 'Hindi', 'label': 'Hindi (हिन्दी)'},
                        {'value': 'Indonesian', 'label': 'Indonesian (Bahasa Indonesia)'},
                        {'value': 'Chinese', 'label': 'Chinese (中文)'},
                        {'value': 'Arabic', 'label': 'Arabic (العربية)'},
                        {'value': 'Turkish', 'label': 'Turkish (Türkçe)'},
                        {'value': 'Polish', 'label': 'Polish (Polski)'},
                        {'value': 'Ukrainian', 'label': 'Ukrainian (Українська)'},
                        {'value': 'Japanese', 'label': 'Japanese (日本語)'},
                        {'value': 'Korean', 'label': 'Korean (한국어)'},
                        {'value': 'Thai', 'label': 'Thai (ไทย)'}] %}
                    {% for lang in langs %}
                    <option value="{{ lang.value }}"{% if lang.value == 'English' %} selected{% endif %}>{{ lang.label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="text-align: center;">
            <button id="btnGenerate" class="btn btn-teal btn-lg">Generate Questions & Start Interview</button>
        </div>
    </div>

    <div id="status" class="loading-state"></div>
</div>
<script src="{{ url_for('static', filename='js/setup.js') }}"></script>
{% endblock %}
