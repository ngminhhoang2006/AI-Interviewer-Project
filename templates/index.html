<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Interviewer - Setup</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1, h2 { color: #2c3e50; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input[type="file"], button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #3498db; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 15px; font-weight: bold; color: #27ae60; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Interview System</h1>
    
    <div id="step-upload">
        <h2>Step 1: Upload Candidate CV</h2>
        <form id="uploadForm">
            <label for="cv_file">Select CV (PDF):</label>
            <input type="file" id="cv_file" name="cv_file" accept=".pdf" required>
            <button type="submit">Parse CV</button>
        </form>
    </div>

    <div id="step-questions" class="hidden">
        <h2>Step 2: Generate Questions</h2>
        <p>Candidate: <strong id="candidateName"></strong></p>
        
        <label for="language">Interview Language:</label>
        <select id="language">
            <option value="English">English</option>
            <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
        </select>

        <button id="btnGenerate">Generate Questions & Start Interview</button>
    </div>

    <div id="status"></div>
</div>

<script>
    let currentCandidateFolder = "";

    document.getElementById("uploadForm").onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append("cv_file", document.getElementById("cv_file").files[0]);

        document.getElementById("status").innerText = "Parsing CV PDF...";

        const response = await fetch("/upload_cv", { method: "POST", body: formData });
        const data = await response.json();

        if (response.ok) {
            currentCandidateFolder = data.candidate_folder;
            document.getElementById("candidateName").innerText = data.candidate;
            document.getElementById("step-upload").classList.add("hidden");
            document.getElementById("step-questions").classList.remove("hidden");
            document.getElementById("status").innerText = "CV parsed successfully!";
        } else {
            document.getElementById("status").innerText = "Error: " + data.error;
        }
    };

    document.getElementById("btnGenerate").onclick = async () => {
        const language = document.getElementById("language").value;
        document.getElementById("status").innerText = "Generating questions via Ollama (this may take a few moments)...";

        const response = await fetch("/generate_questions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ candidate_folder: currentCandidateFolder, language: language })
        });

        const data = await response.json();
        if (response.ok) {
            window.location.href = data.redirect;
        } else {
            document.getElementById("status").innerText = "Error: " + data.error;
        }
    };
</script>

</body>
</html>
