<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Interview Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand">Interview Portal</a>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
            <li><a href="/mic_test" class="{% if request.path == '/mic_test' %}active{% endif %}">Test Mic</a></li>
            <li><a href="/interview_portal" class="{% if '/interview' in request.path or request.path == '/interview_portal' %}active{% endif %}">Take Interview</a></li>
            <li><a href="/results_checker" class="{% if '/results' in request.path or request.path == '/results_checker' %}active{% endif %}">Check Results</a></li>
        
            {% if current_user.is_authenticated %}
                <li><a href="{{ url_for('logout') }}">Logout ({{ current_user.username }})</a></li>
            {% else %}
                <li><a href="{{ url_for('login') }}" class="{% if request.path == '/login' %}active{% endif %}">Login</a></li>
                <li><a href="{{ url_for('signup') }}" class="{% if request.path == '/signup' %}active{% endif %}">Sign Up</a></li>
            {% endif %}
        </ul>
    </nav>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
